# ============================================================================
# Default profile — common configuration shared by all profiles.
# No secrets here: the datasource URL comes from NEON_DATABASE_URL, which is
# supplied locally by the gitignored application-local.yml (run with the
# `local` profile) and by a real env var in deployed environments.
# ============================================================================
spring:
  application:
    name: yks-coaching-platform

  datasource:
    url: ${NEON_DATABASE_URL}
    hikari:
      maximum-pool-size: 10
      pool-name: yks-hikari

  jpa:
    # Flyway owns the schema. Hibernate must NEVER create or alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # db/demo-seed holds demo/manual-testing-only data (V14, V15 — see their own headers).
    # Excluded from the test profile (application-test.yml) so Testcontainers-backed
    # repository tests never see this data; kept here for local/dev/demo use.
    locations: classpath:db/migration,classpath:db/demo-seed
    placeholders:
      # Dev-only default = BCrypt of "admin1234". Override in prod via ADMIN_PASSWORD_HASH
      # (a pre-computed BCrypt hash, not plaintext). Used by V3__seed_admin.sql.
      admin_password_hash: '${ADMIN_PASSWORD_HASH:$2y$10$yl6BvY2.9REyRTbV.9FYP.2xPDn2C1ZhDaggZQLcYAyRBc9Ri4.HC}'

  jackson:
    time-zone: UTC

  # CLAUDE.md pagination convention: max page size = 100 across every listing endpoint.
  data:
    web:
      pageable:
        max-page-size: 100

  # Google OAuth2 login. Real creds come from application-local.yml / deploy env vars;
  # dummy defaults keep the context bootable when creds are absent (login just won't work).
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    environment: ${APP_ENV:local}
    trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
    login:
      ip-limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:20}
      identifier-limit: ${RATE_LIMIT_LOGIN_IDENTIFIER_LIMIT:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register:
      ip-limit: ${RATE_LIMIT_REGISTER_IP_LIMIT:20}
      identifier-limit: ${RATE_LIMIT_REGISTER_IDENTIFIER_LIMIT:3}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
    refresh:
      ip-limit: ${RATE_LIMIT_REFRESH_IP_LIMIT:30}
      token-limit: ${RATE_LIMIT_REFRESH_TOKEN_LIMIT:30}
      window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
    oauth2-exchange:
      ip-limit: ${RATE_LIMIT_OAUTH2_EXCHANGE_IP_LIMIT:30}
      window-seconds: ${RATE_LIMIT_OAUTH2_EXCHANGE_WINDOW_SECONDS:60}
  demo-seed-enabled: ${DEMO_SEED_ENABLED:false}
  jwt:
    # HS256 signing key (>= 32 bytes). Supplied via JWT_SECRET (application-local.yml / env).
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
    login-code-ttl-seconds: ${OAUTH2_LOGIN_CODE_TTL_SECONDS:120}
  resend:
    # Resend API key — secret, env only (RESEND_API_KEY in application-local.yml / env). No default.
    api-key: ${RESEND_API_KEY}
    # Sender address. Resend's onboarding sender works in sandbox without domain verification.
    from: ${RESEND_FROM:onboarding@resend.dev}
  payment:
    # Commission fraction snapshotted onto each Payment (0.20 = 20%). Platform-set.
    commission-rate: ${PAYMENT_COMMISSION_RATE:0.20}
    # Daily charge attempts in the PAST_DUE grace window before a subscription EXPIRES.
    retry-days: ${PAYMENT_RETRY_DAYS:3}
    # How long a subscription may stay PENDING_PAYMENT (unpaid/abandoned or failed checkout)
    # before the renewal job expires it and frees the student to subscribe to that coach again.
    pending-checkout-timeout-minutes: ${PAYMENT_PENDING_CHECKOUT_TIMEOUT_MINUTES:30}
    # Renewal job schedule — daily 03:00 Europe/Istanbul (zone set on the @Scheduled).
    renewal-cron: ${PAYMENT_RENEWAL_CRON:0 0 3 * * *}

# ============================================================================
# Iyzico Payment Client Configuration
# ============================================================================
payments:
  iyzico:
    enabled: ${IYZICO_ENABLED:false}
    mode: ${IYZICO_MODE:sandbox}
    api-key: ${IYZICO_API_KEY:}
    secret-key: ${IYZICO_SECRET_KEY:}
    base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    callback-url: ${IYZICO_CALLBACK_URL:http://localhost:8080/api/v1/payments/iyzico/webhook}
  stub:
    success-enabled: ${PAYMENTS_STUB_SUCCESS_ENABLED:false}
