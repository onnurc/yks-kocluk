# ============================================================================
# Default profile — common configuration shared by all profiles.
# No secrets here: the datasource URL comes from NEON_DATABASE_URL, which is
# supplied locally by the gitignored application-local.yml (run with the
# `local` profile) and by a real env var in deployed environments.
# ============================================================================
spring:
  application:
    name: yks-coaching-platform

  datasource:
    url: ${NEON_DATABASE_URL}
    username: ${NEON_DATABASE_USERNAME}
    password: ${NEON_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: yks-hikari

  jpa:
    # Flyway owns the schema. Hibernate must NEVER create or alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # db/demo-seed holds demo/manual-testing-only data (V14, V15, V28 — see their headers).
    # Deliberately an ALLOWLIST, not excluded-per-profile: this project has no dedicated
    # "prod" Spring profile (Railway runs the bare/default profile — see handoff.md's Resend
    # section), so if demo-seed were included here by default, prod would silently run it too
    # and seed a known-password ADMIN account. Only application-local.yml opts back in.
    # See handoff.md "Demo-seed Flyway location + DemoSeedCleanupComponent trap" (2026-08-15).
    locations: classpath:db/migration
    placeholders:
      # Without an explicit value, a fresh local database receives an intentionally unusable
      # sentinel rather than a known credential. Configure a BCrypt hash in the gitignored local
      # file when local admin access is needed. Non-local startup additionally requires and
      # validates ADMIN_PASSWORD_HASH and detects an already-migrated historical default account.
      admin_password_hash: '${ADMIN_PASSWORD_HASH:LOCAL_ADMIN_DISABLED}'

  jackson:
    time-zone: UTC

  # CLAUDE.md pagination convention: max page size = 100 across every listing endpoint.
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      # Shared production rate-limit store. Use a TLS redis:// or rediss:// deployment URL;
      # credentials, when required, remain only in the environment.
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

  # Google OAuth2 login. Real creds come from application-local.yml / deploy env vars;
  # dummy defaults keep the context bootable when creds are absent (login just won't work).
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}

# Railway terminates TLS at its proxy. Honor the original scheme/host when Spring builds
# OAuth2 callback URLs from {baseUrl}; set to none only when running without a trusted proxy.
server:
  # Fail closed for direct deployments: forwarded headers are ignored unless the operator has
  # explicitly placed a sanitizing reverse proxy in front of the service.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  r2:
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    endpoint: ${R2_ENDPOINT:}
    upload-url-expiration-minutes: ${R2_UPLOAD_URL_EXPIRATION_MINUTES:10}
    download-url-expiration-minutes: ${R2_DOWNLOAD_URL_EXPIRATION_MINUTES:10}
  media:
    # This backend's own externally reachable origin. Public media URLs handed to clients point
    # at GET /api/v1/public/media/{opaqueToken} here, which redirects to a freshly signed storage
    # URL, so the bucket's own hostname never has to be reachable by the browser.
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    profile-image-max-bytes: ${MEDIA_PROFILE_IMAGE_MAX_BYTES:5242880}
    document-max-bytes: ${MEDIA_DOCUMENT_MAX_BYTES:10485760}
    cleanup:
      pending-upload-expiration: ${MEDIA_PENDING_UPLOAD_EXPIRATION:24h}
      batch-size: ${MEDIA_PENDING_CLEANUP_BATCH_SIZE:100}
      cron: ${MEDIA_PENDING_CLEANUP_CRON:0 10 * * * *}
      retired-cron: ${MEDIA_RETIRED_CLEANUP_CRON:0 */15 * * * *}
  cors:
    # Comma-separated exact origins. Set CORS_ALLOWED_ORIGINS to the deployed frontend
    # origin(s), e.g. https://app.example.com,https://www.example.com. Wildcards are rejected.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    environment: ${APP_ENV:production}
    # Default profile is production-like and therefore uses one atomic Redis counter namespace
    # across replicas. local/test/stub profiles always select the in-memory implementation.
    store: ${RATE_LIMIT_STORE:REDIS}
    # Explicit availability policy: continue with per-instance limits during a Redis outage.
    # Set FAIL_CLOSED where rejecting protected actions is preferable to degraded protection.
    failure-policy: ${RATE_LIMIT_FAILURE_POLICY:IN_MEMORY_FALLBACK}
    trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
    # Forwarded IPs are accepted only when the socket peer matches one of these proxy CIDRs.
    trusted-proxy-cidrs: ${RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    login:
      ip-limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:20}
      identifier-limit: ${RATE_LIMIT_LOGIN_IDENTIFIER_LIMIT:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register:
      ip-limit: ${RATE_LIMIT_REGISTER_IP_LIMIT:20}
      identifier-limit: ${RATE_LIMIT_REGISTER_IDENTIFIER_LIMIT:3}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
    refresh:
      ip-limit: ${RATE_LIMIT_REFRESH_IP_LIMIT:30}
      token-limit: ${RATE_LIMIT_REFRESH_TOKEN_LIMIT:30}
      window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
    oauth2-exchange:
      ip-limit: ${RATE_LIMIT_OAUTH2_EXCHANGE_IP_LIMIT:30}
      window-seconds: ${RATE_LIMIT_OAUTH2_EXCHANGE_WINDOW_SECONDS:60}
    forgot-password:
      ip-limit: ${RATE_LIMIT_FORGOT_PASSWORD_IP_LIMIT:10}
      identifier-limit: ${RATE_LIMIT_FORGOT_PASSWORD_EMAIL_LIMIT:3}
      window-seconds: ${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:900}
    reset-password:
      ip-limit: ${RATE_LIMIT_RESET_PASSWORD_IP_LIMIT:20}
      identifier-limit: ${RATE_LIMIT_RESET_PASSWORD_TOKEN_LIMIT:5}
      window-seconds: ${RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}
    change-password:
      ip-limit: ${RATE_LIMIT_CHANGE_PASSWORD_IP_LIMIT:10}
      identifier-limit: ${RATE_LIMIT_CHANGE_PASSWORD_USER_LIMIT:5}
      window-seconds: ${RATE_LIMIT_CHANGE_PASSWORD_WINDOW_SECONDS:900}
    email-verification:
      ip-limit: ${RATE_LIMIT_EMAIL_VERIFICATION_IP_LIMIT:30}
      identifier-limit: ${RATE_LIMIT_EMAIL_VERIFICATION_USER_LIMIT:10}
      window-seconds: ${RATE_LIMIT_EMAIL_VERIFICATION_WINDOW_SECONDS:600}
    email-verification-resend:
      ip-limit: ${RATE_LIMIT_EMAIL_VERIFICATION_RESEND_IP_LIMIT:20}
      identifier-limit: ${RATE_LIMIT_EMAIL_VERIFICATION_RESEND_USER_LIMIT:5}
      window-seconds: ${RATE_LIMIT_EMAIL_VERIFICATION_RESEND_WINDOW_SECONDS:3600}
    coach-application:
      ip-limit: ${RATE_LIMIT_COACH_APPLICATION_IP_LIMIT:10}
      identifier-limit: ${RATE_LIMIT_COACH_APPLICATION_EMAIL_LIMIT:3}
      window-seconds: ${RATE_LIMIT_COACH_APPLICATION_WINDOW_SECONDS:3600}
    media-presign:
      user-limit: ${RATE_LIMIT_MEDIA_PRESIGN_USER_LIMIT:12}
      window-seconds: ${RATE_LIMIT_MEDIA_PRESIGN_WINDOW_SECONDS:600}
    message-send:
      user-limit: ${RATE_LIMIT_MESSAGE_SEND_USER_LIMIT:60}
      window-seconds: ${RATE_LIMIT_MESSAGE_SEND_WINDOW_SECONDS:60}
    trial-create:
      user-limit: ${RATE_LIMIT_TRIAL_CREATE_USER_LIMIT:5}
      window-seconds: ${RATE_LIMIT_TRIAL_CREATE_WINDOW_SECONDS:3600}
    report-create:
      user-limit: ${RATE_LIMIT_REPORT_CREATE_USER_LIMIT:10}
      window-seconds: ${RATE_LIMIT_REPORT_CREATE_WINDOW_SECONDS:3600}
    media-complete:
      user-limit: ${RATE_LIMIT_MEDIA_COMPLETE_USER_LIMIT:30}
      window-seconds: ${RATE_LIMIT_MEDIA_COMPLETE_WINDOW_SECONDS:600}
    checkout-create:
      user-limit: ${RATE_LIMIT_CHECKOUT_CREATE_USER_LIMIT:5}
      window-seconds: ${RATE_LIMIT_CHECKOUT_CREATE_WINDOW_SECONDS:3600}
  demo-seed-enabled: ${DEMO_SEED_ENABLED:false}
  jwt:
    # HS256 signing key (>= 32 bytes). Supplied via JWT_SECRET (application-local.yml / env).
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
  websocket-security:
    max-connections-per-user: ${WEBSOCKET_MAX_CONNECTIONS_PER_USER:10}
    max-subscriptions-per-session: ${WEBSOCKET_MAX_SUBSCRIPTIONS_PER_SESSION:20}
    server-heartbeat-millis: ${WEBSOCKET_SERVER_HEARTBEAT_MILLIS:10000}
    client-heartbeat-millis: ${WEBSOCKET_CLIENT_HEARTBEAT_MILLIS:10000}
  password-security:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    reset-token-ttl: 30m
    token-retention: 7d
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 20 3 * * *}
  email-verification:
    code-ttl: 10m
    resend-cooldown: 60s
    retention: 7d
    max-attempts: 5
    cleanup-cron: ${EMAIL_VERIFICATION_CLEANUP_CRON:0 30 3 * * *}
    # Deletes only ACTIVE, unverified PUBLIC_PASSWORD registrations after 24 hours.
    # Runs at the top of every UTC hour while the backend process is running.
    unverified-account-cleanup-cron: ${UNVERIFIED_REGISTRATION_CLEANUP_CRON:0 0 * * * *}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}
    login-code-ttl-seconds: ${OAUTH2_LOGIN_CODE_TTL_SECONDS:120}
  resend:
    # Resend API key — secret, env only (RESEND_API_KEY in application-local.yml / env). No default.
    api-key: ${RESEND_API_KEY}
    # Sender address. Sandbox default is dev-only — required outside local/stub (ResendConfig
    # fail-fast guard). uniformakademi.com is verified in Resend (2026-08-15); prod sets
    # RESEND_FROM="Uniform Akademi <noreply@uniformakademi.com>", see application-local.yml.example.
    from: ${RESEND_FROM:onboarding@resend.dev}
    # Optional reply-to address (e.g. a support inbox). Omitted from the Resend request entirely
    # when blank — see ResendMailClient.
    reply-to: ${RESEND_REPLY_TO:}
  payment:
    # Commission fraction snapshotted onto each Payment (0.20 = 20%). Platform-set.
    commission-rate: ${PAYMENT_COMMISSION_RATE:0.20}
    # Daily charge attempts in the PAST_DUE grace window before a subscription EXPIRES.
    retry-days: ${PAYMENT_RETRY_DAYS:3}
    # How long a subscription may stay PENDING_PAYMENT (unpaid/abandoned or failed checkout)
    # before the renewal job expires it and frees the student to subscribe to that coach again.
    pending-checkout-timeout-minutes: ${PAYMENT_PENDING_CHECKOUT_TIMEOUT_MINUTES:30}
    # Renewal job schedule — daily 03:00 Europe/Istanbul (zone set on the @Scheduled).
    renewal-cron: ${PAYMENT_RENEWAL_CRON:0 0 3 * * *}
  message-notification:
    # "New message" email debounce, per (conversation, recipient). One email, then silence for
    # this long no matter how many messages follow — the recipient is offline, so a burst would
    # otherwise become a burst of mail. Only applies when the recipient has no live WebSocket
    # session; connected users get the in-app badge and no mail at all.
    debounce: ${MESSAGE_NOTIFICATION_DEBOUNCE:30m}
    # Same origin as password-security's, deliberately bound separately (see the properties record).
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  session-reminder:
    # How far before a session's start the reminder becomes eligible. Actual delivery jitters by
    # up to the job's poll interval (cron below), since a session is caught on whichever run first
    # sees it inside the window.
    lead-time: ${SESSION_REMINDER_LEAD_TIME:24h}
    # Reminder job schedule — every 15 min (needs to be frequent; unlike the once-daily renewal
    # job, delivery timing here is user-facing).
    cron: ${SESSION_REMINDER_CRON:0 */15 * * * *}

# ============================================================================
# Iyzico Payment Client Configuration
# ============================================================================
payments:
  iyzico:
    enabled: ${IYZICO_ENABLED:false}
    mode: ${IYZICO_MODE:sandbox}
    api-key: ${IYZICO_API_KEY:}
    secret-key: ${IYZICO_SECRET_KEY:}
    base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
    callback-url: ${IYZICO_CALLBACK_URL:http://localhost:8080/api/v1/payments/iyzico/webhook}
  stub:
    # Used only by the local/stub/test StubIyzicoClient; production has no stub client/controller.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
