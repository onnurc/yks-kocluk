# ============================================================================
# test profile — used by Testcontainers-backed integration tests.
# NO datasource URL here on purpose: the PostgreSQL container is supplied at
# runtime via @ServiceConnection (see TestcontainersConfiguration). Flyway runs
# the real migrations against that container.
# ============================================================================
spring:
  jpa:
    # Flyway owns the schema, even in tests. Never create/alter via Hibernate.
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Demo/manual-testing seed data (db/demo-seed — see application.yml) is deliberately
    # excluded here: it polluted @DataJpaTest slice assertions that expect a clean table
    # (DemoSeedCleanupComponent can't clean it up in a slice context — it never loads).
    locations: classpath:db/migration
    placeholders:
      # Test-only credential used by integration fixtures. Never active outside the test profile.
      admin_password_hash: '$2y$10$yl6BvY2.9REyRTbV.9FYP.2xPDn2C1ZhDaggZQLcYAyRBc9Ri4.HC'

app:
  jwt:
    # Test-only HS256 key (>= 32 bytes). Not a real secret — safe to commit.
    secret: test-only-jwt-secret-not-for-production-0123456789
